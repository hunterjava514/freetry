<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Form</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 10px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .form-container {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .btn-success {
            background-color: #2ecc71;
        }
        
        .btn-success:hover {
            background-color: #27ae60;
        }
        
        .btn-danger {
            background-color: #e74c3c;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        .data-section {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #eee;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .data-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .data-table tr:hover {
            background-color: #f1f8ff;
        }
        
        .delete-btn {
            color: #e74c3c;
            cursor: pointer;
            font-weight: bold;
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 20px;
            background-color: #2ecc71;
            color: white;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .notification.error {
            background-color: #e74c3c;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .actions .btn {
            flex: 1;
        }
        
        @media (max-width: 600px) {
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Entry Form</h1>
            <p class="subtitle">Enter inspection data and export to Excel</p>
        </header>
        
        <div class="form-container">
            <form id="dataForm">
                <div class="form-group">
                    <label for="number">Number</label>
                    <input type="text" id="number" required>
                </div>
                
                <div class="form-group">
                    <label for="inspector">Inspector</label>
                    <input type="text" id="inspector" required>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="dateClosed">Date Closed</label>
                    <input type="date" id="dateClosed">
                </div>
                
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" required>
                </div>
                
                <div class="form-group">
                    <label for="area">Area</label>
                    <select id="area" required>
                        <option value="">Select Area</option>
                        <option value="Production">Production</option>
                        <option value="Warehouse">Warehouse</option>
                        <option value="Office">Office</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Quality Control">Quality Control</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="observation">Observation</label>
                    <textarea id="observation" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="mmt">MMT</label>
                    <input type="text" id="mmt">
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="">Select Status</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">Add Entry</button>
            </form>
            
            <div class="actions">
                <button id="exportBtn" class="btn btn-success">Export to Excel</button>
                <button id="clearBtn" class="btn btn-danger">Clear All Data</button>
            </div>
            
            <div class="data-section">
                <h2>Stored Data</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Inspector</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>

    <script>
        // Initialize data array
        let formData = JSON.parse(localStorage.getItem('inspectionData')) || [];
        
        // DOM elements
        const dataForm = document.getElementById('dataForm');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');
        const dataTableBody = document.getElementById('dataTableBody');
        const notification = document.getElementById('notification');
        
        // Set today's date as default for date field
        document.getElementById('date').valueAsDate = new Date();
        
        // Render table with existing data
        renderTable();
        
        // Form submission handler
        dataForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const entry = {
                number: document.getElementById('number').value,
                inspector: document.getElementById('inspector').value,
                date: document.getElementById('date').value,
                dateClosed: document.getElementById('dateClosed').value,
                location: document.getElementById('location').value,
                area: document.getElementById('area').value,
                observation: document.getElementById('observation').value,
                mmt: document.getElementById('mmt').value,
                status: document.getElementById('status').value,
                id: Date.now() // Unique ID for deletion
            };
            
            // Add to data array
            formData.push(entry);
            
            // Save to localStorage
            localStorage.setItem('inspectionData', JSON.stringify(formData));
            
            // Update table
            renderTable();
            
            // Reset form
            dataForm.reset();
            document.getElementById('date').valueAsDate = new Date();
            
            // Show success notification
            showNotification('Data added successfully!');
        });
        
        // Export to Excel
        exportBtn.addEventListener('click', function() {
            if (formData.length === 0) {
                showNotification('No data to export!', true);
                return;
            }
            
            // Create worksheet
            const ws = XLSX.utils.json_to_sheet(formData);
            
            // Create workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inspection Data");
            
            // Generate Excel file and trigger download
            XLSX.writeFile(wb, "inspection_data.xlsx");
            
            showNotification('Data exported successfully!');
        });
        
        // Clear all data
        clearBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to clear all data? This action cannot be undone.')) {
                formData = [];
                localStorage.removeItem('inspectionData');
                renderTable();
                showNotification('All data cleared!');
            }
        });
        
        // Render table with data
        function renderTable() {
            dataTableBody.innerHTML = '';
            
            if (formData.length === 0) {
                dataTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No data available</td></tr>';
                return;
            }
            
            formData.forEach(entry => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${entry.number}</td>
                    <td>${entry.inspector}</td>
                    <td>${entry.date}</td>
                    <td>${entry.location}</td>
                    <td>${entry.status}</td>
                    <td class="delete-btn" data-id="${entry.id}">Delete</td>
                `;
                
                dataTableBody.appendChild(row);
            });
            
            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    deleteEntry(id);
                });
            });
        }
        
        // Delete a specific entry
        function deleteEntry(id) {
            if (confirm('Are you sure you want to delete this entry?')) {
                formData = formData.filter(entry => entry.id !== id);
                localStorage.setItem('inspectionData', JSON.stringify(formData));
                renderTable();
                showNotification('Entry deleted successfully!');
            }
        }
        
        // Show notification
        function showNotification(message, isError = false) {
            notification.textContent = message;
            notification.className = 'notification';
            
            if (isError) {
                notification.classList.add('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
